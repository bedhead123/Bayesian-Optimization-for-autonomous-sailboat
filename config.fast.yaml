optimization:
  n_initial: 20
  n_iter: 80
  min_iterations: 10
  convergence_threshold: 0.005
  num_restarts: 5
  raw_samples: 20
  gp_jitter: 1.0e-6

calibration:
  frequency: 999  # don't run mid-fi during fast test

validation:
  fine_cfd_cells: 50000
  max_accel_g: 19.0
  max_pressure_pa: 3200000.0
  max_self_right_time_s: 10.0
  rt_upper_bound_factor: 2.0
  extreme_wave_H_factor: 4.0
  drop_height: 15.0
  storm_wind_speed_knots: 80.0
  safety_factor_composite: 2.0
  min_righting_energy: 40.0
  min_reserve_buoyancy: 0.40
  single_sail_max_helm_angle_deg: 5.0
  n_procs: 1

paths:
  output_dir: ./output
  database: ./output/optimization.db
  openfoam_env: /opt/openfoam2512/etc/bashrc
  dualsphysics_dir: ./bin/dualsphysics/5.4

fixed:
  target_speed_knots: 3.5
  target_displacement: 0.10
  gravity: 9.81
  rho_water: 1025.0
  nu_water: 1.19e-6
  electronics_bay: [0.6, 0.0, 0.05]
  wingsail_cr_frac: 0.34
  wingsail_tip_taper: 0.7
  wingsail_span_frac: 1.00
  wingsail_tail_area_frac: 0.35
  wingsail_tail_arm_chords: 1.75
  wingsail_mast_chord_frac: 0.25
  wingsail_mast_mass: 7.0
  wingsail_nose_pod_mass: 3.0
  mast_cg_height_frac: 0.50
  payload_mass_kg: 15.0
  payload_cg_z: 0.30
  hull_mass_floor_kg: 20.0
  fouling_cf_mult: 1.25

bounds:
  LWL: [2.30, 2.50]
  BWL: [0.55, 0.68]
  T_canoe: [0.28, 0.36]
  Cp: [0.55, 0.60]
  Cm: [0.78, 0.90]
  LCB: [45.0, 56.0]        # %LWL from bow, 45 = midship anchor
  D_keel: [0.45, 0.65]
  keel_chord: [0.18, 0.26]
  bulb_vol: [0.0015, 0.0025]
  bulb_pos: [0.30, 0.50]
  E: [0.28, 0.40]
  flare: [10.0, 24.0]
  deadrise: [16.0, 28.0]
  bilge_r: [0.18, 0.30]
  keel_rake: [15.0, 30.0]
  ballast_frac: [0.35, 0.55]
  wingsail_pos: [0.30, 0.75]  # %LWL from bow

weights:
  w1: 1.0
  w2: 0.5
  w3: 0.5
  w4: 2.0
  w5: 0.4
  stability_normalization: 30.0
  light_wind_bonus: 1.2
  w6: 0.5
  w7: 0.10
  w8: 0.35
  w9: 0.5
  fom_drag_reference_n: 45.0

wave_spectrum:
  type: JONSWAP
  Hs: 2.5
  Tp: 9.0
  gamma: 3.3
  n_freq: 100
  n_dir: 24
  min_wind_speed_kt: 6.0

rapid_validation:
  storm_hs_factor: 4.0
  storm_tp_factor: 1.3
  storm_n_freq: 30
  storm_headings_deg: [180.0, 135.0, 90.0]
  min_avs_deg: 110.0
  slam_drop_height_m: 15.0
  parametric_roll_band_frac: 0.15
  roll_sigma_max_deg: 120.0
  capsize_safety_factor: 1.0
  deck_allowable_pa: 100000.0

reference:
  tool: "none"
  Hs: 0.6
  Tp: 2.5
  gamma: 3.3

logging:
  level: INFO
  file: ./output/pipeline.log
