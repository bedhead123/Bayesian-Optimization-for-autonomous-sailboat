bounds:
  LWL: [2.30, 2.50]
  BWL: [0.55, 0.68]        # was 0.60-0.85 fat cup — 0.55-0.68 slender fast-survival L/B 3.7-4.5 (Sailbuoy B=0.52)
  T_canoe: [0.28, 0.36]    # Skinny V deep: deep canoe carries 0.10 disp without fat beam, keeps V for 50ft slam
  Cp: [0.55, 0.60]         # PYD upwind optimum ~0.55; Delft-series validity 0.519-0.599
  Cm: [0.78, 0.90]         # keep full midship for volume with narrow beam
  LCB: [45.0, 56.0]        # PYD p.87: LCB 3.5-4.5% aft of midship at Fn 0.35 (was 30-60 — allowed bow-heavy lee helm)
  D_keel: [0.45, 0.65]     # Review T/L 0.15-0.3 fleet band → T_total ≤ 0.72 m at 2.4 m LWL (was 0.9-1.9 = T/L 0.94!)
  keel_chord: [0.18, 0.26] # PYD Fig 6.38: keel area 1.9-3.0% of SA at reduced depth (was 0.16-0.22, 4x oversized)
  bulb_vol: [0.0015, 0.0025] # ballast lives IN the bulb at lowest VCG (PYD Ch.6 bulb keels)
  bulb_pos: [0.30, 0.50]
  E: [0.28, 0.40]          # Rebalanced survive-not-thrive: lower freeboard reduces deck slab (L/B 2:1 -> ~2.5); reserve still passes at 0.40
  flare: [10.0, 24.0]      # Rebalanced: cap midship flare 35->24 to tame deck beam; storm reserve via structure not flare
  deadrise: [16.0, 28.0]   # Rebalanced: allow moderate V (16deg avoids flat-wall slam, 28deg keeps storm bite); was locked [28,30] triangle bottom
  bilge_r: [0.18, 0.30]    # Rebalanced: rounder bilge avoids knife-edge; was [0.14,0.22] tight V
  keel_rake: [15.0, 30.0]  # deg — Review §3.3.2: USNA ~30° aft-swept LE for weed/net shedding (was 0.001-0.02 = vertical keel)
  ballast_frac: [0.35, 0.55] # PYD p.100 fleet 0.25-0.50 (was 0.60-0.75, corner-pinned every finalist)
  wingsail_pos: [0.30, 0.75]

fixed:
  target_speed_knots: 3.5   # PYD: Cp 0.55 tuned to Fn 0.35; Cao Fanhai-T2 (LDR 4.6) maxed at 3.2 kn at 4 kn+ LDR 5.2
  target_displacement: 0.10 # 100 kg → LDR 5.2 at 2.4 m (was 0.14 → LDR 4.6 on the Fn 0.45 barrier); Sailbuoy 60 kg/2.0 m
  use_nurbs_geometry: true
  use_nurbs_gz: true
  gravity: 9.81
  rho_water: 1025.0
  nu_water: 1.19e-6
  electronics_bay: [0.6, 0.0, 0.05]  # physical payload location: bow-quarter, deck height (pitch lever ≠ 0)
  wingsail_cr_frac: 0.34   # AR = span/(0.85·cr·LWL) = 3.5 — Cao fixed AR 3.5; JMSE AR 4; was 0.43 (AR 2.74)
  wingsail_tip_taper: 0.7
  wingsail_span_frac: 1.00
  wingsail_tail_area_frac: 0.35  # JMSE optimum 35% (CLmax 1.16, L/D +15.4%)
  wingsail_tail_arm_chords: 1.75  # was 2.00 — 1.75 per user: tightest stable tail coupling, minimal CE travel, fastest weathervaning
  wingsail_mast_chord_frac: 0.25
  wingsail_mast_mass: 7.0
  wingsail_nose_pod_mass: 3.0  # was 4.0 — 7+3=10kg ≤10kg limit (1kg@1.4m=0.009m GM) per mass-balance audit
  mast_cg_height_frac: 0.50
  payload_mass_kg: 15.0     # electronics/solar/batteries at deck height — mass model now real (was lumped into hull at -0.4T)
  payload_cg_z: 0.30
  hull_mass_floor_kg: 20.0  # structural floor — Fanhai-T2 optimized hull 38.7 kg at 2.0 m; prevents fake hull mass
  fouling_cf_mult: 1.25     # Review §7.2: long-duration drag penalty (barnacles 2-3x viscous; Sailbuoy 118-day crossing)

weights:
  w1: 1.8   # was 1.0 — pay for 3.5kt drag (normalized via fom_drag_reference_n)
  w2: 0.25  # was 0.5 — stability via deep keel not fat beam
  w3: 0.6   # keep self-right
  w4: 2.0
  w5: 0.8   # helm soft 30° reward (hard signed-lead gate in constraints.py)
  w6: 0.5
  w7: 0.10  # survive-not-thrive: reduced storm-accel weight (was 0.2); storm still shapes via tanh but doesn't dominate light-water drag (w1=1.8)
  w8: 0.35  # survive-not-thrive: reduced hull-stress weight (was 0.9); 50ft slam survivability via reinforcement/damping, not hull contortion; retains gentle gradient for small drag -> large slam gain
  w9: 0.5
  stability_normalization: 30.0
  light_wind_bonus: 1.2  # not-overbuilt requirement — light-wind mobility hard-enforced
  fom_drag_reference_n: 45.0  # R_REF so w1/Rt spans ~0.3-0.5 FoM, not 0.004 (was drowned by saturated constants)

optimization:
  n_initial: 80
  n_iter: 300
  convergence_threshold: 0.01
  min_iterations: 100
  num_restarts: 30
  raw_samples: 256
  gp_jitter: 1.0e-4
  lhs_min: 30
  lhs_increment: 15
  lhs_max: 60
  lhs_seed: 42

calibration:
  frequency: 0  # OFF during BO — 13/13 SPH tows invalid at dp=0.05 (staircase-DBC ~16x low-fi); audit only via --validate-only top-3
  coarse_cells: 200000
  tolerance: 0.20
  timeout: 3600
  n_procs: 8
  end_time: 20.0
  delta_t: 0.001
  max_co: 0.7
  retry_failed: true
  max_particles: 400000
  factor_bounds: [0.5, 2.0]  # raw SPH/low-fi drag factor outside band -> calibration invalid (Bug #157 guard)
  solver: "sph"
  sph_dp: 0.05
  sph_sim_time: 6.0
  convergence:
    min_sim_time: 2.0   # moving-hull tow: sim capped ~2.9 s by particle budget; dt_out rounding can end traces at 2.10 s (design_116)
    window_s: 1.2       # tail window for Rt averaging (post-transient, t>=1.2 s)
    rel_tol: 0.015
    n_checks: 2
    poll_interval_s: 60

validation:
  fine_cfd_cells: 500000
  regular_wave_H: 0.06
  regular_wave_T: 0.47
  extreme_wave_H_factor: 4.0
  drop_height: 15.0  # 50 ft hurricane drop — survive-not-thrive: kept as validation survivability gate (top-3), not BO shape driver
  inverted_speed_knots: 25.0
  max_accel_g: 19.0   # survive-not-thrive: 15->19g with reinforced hull + electronic damping (was storm electronics hard gate)
  max_pressure_pa: 3200000.0  # survive-not-thrive: 2.5->3.2 MPa for reinforced hull (Wagner peak ~5 MPa @15°, structure takes it)
  max_self_right_time_s: 10.0
  rt_upper_bound_factor: 2.0
  storm_wind_speed_knots: 80.0
  safety_factor_composite: 2.0
  min_righting_energy: 40.0
  min_ballast_ratio: 0.25
  min_reserve_buoyancy: 0.40   # survive-not-thrive: 0.45->0.40 allows lower E/flare for light-water speed; reserve still via high freeboard when needed
  single_sail_max_helm_angle_deg: 5.0  # helm hard gate — real boats 3-4° ideal (now enforced signed in constraints.py)
  n_procs: 8
  gate_timeout: 14400
  gate2_timeout: 28800
  sph_dp: 0.05
  sph_sim_time: 6.0
  sph_towing_audit: false
  sph_inverted_dp: 0.075  # dp 0.06 gave 650-750k GenCase particles (>400k cap → unverified fallback); 0.075 ≈ (0.06/0.075)³ × 700k ≈ 360k ✓
  sph_inverted_sim_time: 6.0

wave_spectrum:
  type: JONSWAP
  Hs: 2.5
  Tp: 9.0
  gamma: 3.3
  n_freq: 100
  n_dir: 24
  min_wind_speed_kt: 6.0

rapid_validation:
  storm_hs_factor: 4.0    # 10.0 m hurricane sea — the real survival requirement (base 2.5 m)
  storm_tp_factor: 1.3
  storm_n_freq: 15
  storm_headings_deg: [180.0, 135.0, 90.0]
  min_avs_deg: 110.0      # PYD p.59: modern mean 118°, FIR=1 needs AVS 120° (was 90°)
  slam_drop_height_m: 15.0  # 50 ft — matches validation.drop_height (survive-not-thrive: still 15m, but weight reduced)
  slam_max_pressure_pa: 3200000.0  # survive-not-thrive: 2.5->3.2 MPa for reinforced hull
  ops_Hs: 1.2             # normal seas for 2.4m boat — 4 ft, not 8 ft (Hs 2.5 was boat-length wave; survive-not-thrive: realistic ops sea)
  ops_Tp: 7.0             # normal seas period for 1.2m Hs
  parametric_roll_band_frac: 0.15
  roll_sigma_max_deg: 120.0  # storm roll free — self-righting is the survival gate, not rolling
  roll_sigma_ops_max_deg: 35.0  # was 25.0 hard gate for 8 ft seas — 35° for 4 ft ops + soft (autonomous, no crew comfort)
  capsize_safety_factor: 1.0
  wind_heel_max_frac: 0.85
  deck_allowable_pa: 100000.0  # cored laminate skin allowable — inverted/slam margins get a real gradient (was 3.2 MPa, saturated 0.998)
  min_max_gz_m: 0.05
  min_gz_area_30: 0.005
  min_gz_area_40_90: 0.01
  roll_period_min_s: 1.0
  roll_period_max_s: 8.0
  soft_margin_gates: ["capsize", "storm_accel", "slam_pressure", "slam_accel", "inverted_pressure", "roll_sigma", "roll_sigma_ops"]

reference:
  tool: "dualsphysics"
  sim_time_s: 10.0
  timeout_min: 180.0
  dp: 0.06
  dtout: 0.1
  reference_every_n: 10
  Hs: 0.6
  Tp: 2.5
  gamma: 3.3

paths:
  output_dir: "./output"
  openfoam_env: "/opt/openfoam2512/etc/bashrc"
  dualsphysics_dir: "./bin/dualsphysics/5.4"
  database: "./output/optimization.db"

logging:
  level: INFO
  console: true
  file: "./output/pipeline.log"
